<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Tablet</title>
<style>
:root {
  --bg: #0F1417; --side: #151C20; --surface: #1C252A; --border: rgba(255,255,255,0.09);
  --text: #EEF3F4; --muted: #9AA9AE; --accent: #2DD4BF; --accent-text: #062A26;
  --on: #34D399; --off: #6B7A80;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #E9EEF0; --side: #F7F9FA; --surface: #FFFFFF; --border: rgba(15,30,35,0.10);
    --text: #10191C; --muted: #52656B; --accent: #0F766E; --accent-text: #FFFFFF;
    --on: #047857; --off: #8A9A9F;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
  display: flex; flex-wrap: wrap;
}
aside {
  flex: 1 1 280px; max-width: 340px; min-width: 0; background: var(--side); border-right: 1px solid var(--border);
  height: 100%; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.brand svg { flex-shrink: 0; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 999px; background: var(--off); flex-shrink: 0; }
.dot.on { background: var(--on); box-shadow: 0 0 8px var(--on); }
.follow { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.follow input { accent-color: var(--accent); width: 16px; height: 16px; }
.nb { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; }
.nb > button {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px; min-height: 44px;
  background: none; border: none; color: var(--text); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
}
.cover { width: 14px; height: 18px; border-radius: 3px; flex-shrink: 0; }
.count { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); }
.pages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 12px 12px; }
.pages button {
  background: #FFFFFF; border: 2px solid transparent; border-radius: 6px; padding: 0; cursor: pointer;
  aspect-ratio: 1000 / 1414; overflow: hidden; position: relative;
}
.pages button.cur { border-color: var(--accent); }
.pages img { width: 100%; height: 100%; display: block; }
.pages span {
  position: absolute; right: 3px; bottom: 3px; font-size: 10px; color: #334; background: rgba(255,255,255,0.85);
  border-radius: 4px; padding: 0 4px;
}
.empty { color: var(--muted); font-size: 14px; line-height: 1.5; }
.dir { margin-top: auto; font-size: 12px; color: var(--muted); word-break: break-all; }
main {
  flex: 999 1 480px; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 20px; gap: 10px;
}
#title { font-size: 14px; color: var(--muted); min-height: 20px; }
#wrap { flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
canvas { background: #FFFFFF; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.35); max-width: 100%; }
@media (max-width: 760px) {
  aside { max-width: none; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  main { height: 80vh; }
}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 108 108" aria-hidden="true">
      <rect width="108" height="108" rx="22" fill="#0F766E"/>
      <g fill="none" stroke="#CCFBF1" stroke-width="6" stroke-linecap="round"><path d="M24,46 A31,31 0 0 1 80,34"/><path d="M84,62 A31,31 0 0 1 28,74"/></g>
      <path fill="#CCFBF1" d="M86,24 L87,42 L70,37 Z M22,84 L21,66 L38,71 Z"/>
      <rect x="38" y="34" width="32" height="42" rx="5" fill="#FFFFFF"/><rect x="41" y="38" width="26" height="32" rx="2" fill="#2DD4BF"/>
    </svg>
    Sync Tablet
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="device">Sin tablet conectada</span></div>
  <label class="follow"><input type="checkbox" id="follow" checked> Seguir lo que escribo en la tablet</label>
  <div id="notebooks"></div>
  <div class="dir" id="dir"></div>
</aside>
<main>
  <div id="title"></div>
  <div id="wrap"><canvas id="page" width="1000" height="1414" aria-label="Página actual"></canvas></div>
</main>
<script>
const W = 1000, H = 1414;
const state = { notebooks: [], versions: {}, current: null, page: null, open: new Set() };
const $ = (id) => document.getElementById(id);
const canvas = $('page'), ctx = canvas.getContext('2d');

// Mismas fórmulas que la tablet (Ink.java) y el SVG (svg.rs).
function segWidth(tool, w, p, dx, dy) {
  p = Math.min(1, Math.max(0, p));
  switch (tool) {
    case 'pencil': return w * 0.7 * (0.5 + 0.5 * p);
    case 'brush': return w * (0.1 + 1.7 * p);
    case 'calligraphy': return w * (0.25 + 0.95 * Math.abs(Math.sin(Math.atan2(dy, dx) - Math.PI / 4))) * (0.6 + 0.4 * p);
    case 'highlighter': case 'tape': return w;
    default: return w * (0.35 + 0.65 * p);
  }
}
function segOpacity(tool, p) { return tool === 'pencil' ? 0.75 * (0.4 + 0.6 * Math.min(1, Math.max(0, p))) : 1; }

function hline(y, x0 = 0, x1 = W) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }

function drawBackground(bg) {
  if (!bg || bg === 'plain') return;
  ctx.strokeStyle = '#C9D3E3'; ctx.lineWidth = 1; ctx.beginPath();
  if (bg === 'lines' || bg === 'grid' || bg === 'cornell') for (let y = 80; y < H; y += 40) hline(y);
  if (bg === 'grid') for (let x = 40; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  if (bg === 'music') for (let top = 120; top + 48 < H - 40; top += 110) for (let k = 0; k < 5; k++) hline(top + 12 * k, 60, W - 60);
  if (bg === 'todo') for (let y = 100; y < H - 40; y += 64) { hline(y, 90, W - 40); ctx.roundRect(40, y - 32, 26, 26, 5); }
  ctx.stroke();
  if (bg === 'dots') {
    ctx.fillStyle = '#B8C4D6';
    for (let y = 40; y < H; y += 40) for (let x = 40; x < W; x += 40) { ctx.beginPath(); ctx.arc(x, y, 2, 0, 2 * Math.PI); ctx.fill(); }
  }
  if (bg === 'cornell') {
    ctx.strokeStyle = '#E28B8B'; ctx.lineWidth = 2.5; ctx.beginPath();
    ctx.moveTo(250, 40); ctx.lineTo(250, H - 280); hline(H - 280); ctx.stroke();
  }
}

// Imágenes ya cargadas (o cargando), por id.
const images = {};
function image(id) {
  if (!images[id]) {
    const img = new Image();
    img.onload = () => render();
    img.src = `/api/asset/${encodeURIComponent(id)}.jpg`;
    images[id] = img;
  }
  return images[id].complete && images[id].naturalWidth ? images[id] : null;
}

function wrapText(text, w, size) {
  const per = Math.max(1, Math.floor(w / (size * 0.47))), out = [];
  for (const para of text.split('\n')) {
    let cur = '';
    for (const word of para.split(' ')) {
      if (cur && cur.length + 1 + word.length > per) { out.push(cur); cur = ''; }
      cur = cur ? cur + ' ' + word : word;
    }
    out.push(cur);
  }
  return out;
}

function drawItem(it) {
  if (it.kind === 'image') {
    const img = image(it.asset);
    if (img) ctx.drawImage(img, it.x, it.y, it.w, it.h);
    else { ctx.fillStyle = '#EEF2F7'; ctx.fillRect(it.x, it.y, it.w, it.h); }
  } else if (it.kind === 'text') {
    ctx.fillStyle = it.color || '#111827'; ctx.font = `${it.size || 28}px sans-serif`; ctx.textBaseline = 'alphabetic';
    wrapText(it.text, it.w, it.size || 28).forEach((l, i) => ctx.fillText(l, it.x, it.y + (it.size || 28) * (1 + 1.3 * i)));
  }
}

function drawStroke(s) {
  const p = s.points, n = p.length / 3;
  if (!n) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = s.color;
  if (s.tool === 'highlighter' || s.tool === 'tape') {
    ctx.globalAlpha = s.tool === 'tape' ? 0.85 : 0.35; ctx.lineWidth = s.width; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    for (let i = 1; i < n; i++) ctx.lineTo(p[3 * i], p[3 * i + 1]);
    if (n === 1) ctx.lineTo(p[0], p[1]);
    ctx.stroke(); ctx.globalAlpha = 1; return;
  }
  if (n === 1) {
    ctx.lineWidth = segWidth(s.tool, s.width, p[2], 1, 0); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); return;
  }
  for (let i = 1; i < n; i++) {
    const pr = (p[3 * i - 1] + p[3 * i + 2]) / 2, dx = p[3 * i] - p[3 * i - 3], dy = p[3 * i + 1] - p[3 * i - 2];
    ctx.lineWidth = segWidth(s.tool, s.width, pr, dx, dy);
    ctx.globalAlpha = segOpacity(s.tool, pr);
    ctx.beginPath(); ctx.moveTo(p[3 * i - 3], p[3 * i - 2]); ctx.lineTo(p[3 * i], p[3 * i + 1]); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function render() {
  fit();
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  if (!state.page) return;
  const bg = state.page.bg_asset && image(state.page.bg_asset);
  if (bg) {
    const k = Math.min(W / bg.naturalWidth, H / bg.naturalHeight);
    ctx.drawImage(bg, (W - bg.naturalWidth * k) / 2, (H - bg.naturalHeight * k) / 2, bg.naturalWidth * k, bg.naturalHeight * k);
  } else if (!state.page.bg_asset) drawBackground(state.page.background);
  for (const it of state.page.items || []) drawItem(it);
  for (const s of state.page.strokes) drawStroke(s);
  drawLasers();
}

function fit() {
  const box = $('wrap').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const scale = Math.max(0.1, Math.min(box.width / W, box.height / H));
  const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  if (canvas.width !== Math.round(cssW * dpr)) { canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr); }
}

function notebookOf(pageId) { return state.notebooks.find((n) => n.pages.includes(pageId)); }

function setTitle() {
  const nb = state.page && notebookOf(state.page.id);
  $('title').textContent = nb ? `${nb.title} · Página ${nb.pages.indexOf(state.page.id) + 1} de ${nb.pages.length}` : '';
}

async function openPage(id) {
  state.current = id;
  const nb = notebookOf(id);
  if (nb) state.open.add(nb.id);
  const r = await fetch(`/api/page/${encodeURIComponent(id)}`);
  state.page = r.ok ? await r.json() : null;
  if (state.page) state.versions[id] = state.page.version;
  render(); setTitle(); list();
}

function list() {
  const root = $('notebooks');
  root.replaceChildren();
  if (!state.notebooks.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'Todavía no hay apuntes. Abre Sync Tablet en la tablet y escribe: aparecerán aquí al momento.';
    root.append(p); return;
  }
  for (const nb of state.notebooks) {
    const box = document.createElement('div'); box.className = 'nb';
    const head = document.createElement('button');
    const cover = document.createElement('span'); cover.className = 'cover'; cover.style.background = nb.color;
    const name = document.createElement('span'); name.textContent = nb.title;
    const count = document.createElement('span'); count.className = 'count'; count.textContent = `${nb.pages.length} pág.`;
    head.append(cover, name, count);
    head.setAttribute('aria-expanded', state.open.has(nb.id));
    head.onclick = () => { state.open.has(nb.id) ? state.open.delete(nb.id) : state.open.add(nb.id); list(); };
    box.append(head);
    if (state.open.has(nb.id)) {
      const grid = document.createElement('div'); grid.className = 'pages';
      nb.pages.forEach((pid, i) => {
        const b = document.createElement('button');
        if (pid === state.current) b.className = 'cur';
        b.setAttribute('aria-label', `Página ${i + 1}`);
        const img = document.createElement('img');
        img.alt = ''; img.src = `/api/page/${encodeURIComponent(pid)}/svg?v=${state.versions[pid] ?? 0}`;
        const n = document.createElement('span'); n.textContent = i + 1;
        b.append(img, n); b.onclick = () => openPage(pid);
        grid.append(b);
      });
      box.append(grid);
    }
    root.append(box);
  }
}

async function loadAll() {
  const r = await fetch('/api/notebooks');
  const data = await r.json();
  state.notebooks = data.notebooks; state.versions = data.versions;
  $('dir').textContent = `Guardado en ${data.dir}`;
  showDevice(data.device, !!data.device);
  if (!state.current) {
    const first = state.notebooks.find((n) => n.pages.length);
    if (first) return openPage(first.pages[first.pages.length - 1]);
  } else if (state.current) {
    return openPage(state.current);
  }
  list();
}

// Miniaturas: como mucho una recarga por segundo mientras se escribe.
let thumbTimer = null;
function refreshThumbs() { if (!thumbTimer) thumbTimer = setTimeout(() => { thumbTimer = null; list(); }, 1000); }

function showDevice(name, connected) {
  $('dot').classList.toggle('on', connected);
  $('device').textContent = connected ? `${name} conectada` : 'Sin tablet conectada';
}

// Puntero láser de la tablet: rojo, se desvanece en 1,2 s.
let lasers = [];
function drawLasers() {
  const now = performance.now();
  lasers = lasers.filter((l) => now - l.at < 1200);
  for (const l of lasers) {
    const p = l.points, a = 1 - (now - l.at) / 1200;
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#EF4444'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.shadowColor = '#EF4444'; ctx.shadowBlur = 18; ctx.beginPath();
    for (let i = 0; i + 1 < p.length; i += 2) i ? ctx.lineTo(p[i], p[i + 1]) : ctx.moveTo(p[i], p[i + 1]);
    ctx.stroke(); ctx.restore();
  }
  if (lasers.length) requestAnimationFrame(render);
}

async function onLive(m) {
  switch (m.t) {
    case 'device':
      showDevice(m.name, m.connected);
      break;
    case 'stroke':
    case 'erase':
      state.versions[m.page] = m.version;
      if ($('follow').checked && m.page !== state.current) return openPage(m.page);
      if (state.page && m.page === state.page.id) {
        if (m.version !== state.page.version + 1) return openPage(m.page);
        state.page.version = m.version;
        if (m.t === 'stroke') {
          state.page.strokes = state.page.strokes.filter((s) => s.id !== m.stroke.id);
          state.page.strokes.push(m.stroke); drawStroke(m.stroke);
        } else {
          state.page.strokes = state.page.strokes.filter((s) => !m.ids.includes(s.id)); render();
        }
      }
      refreshThumbs();
      break;
    case 'page':
      state.versions[m.page.id] = m.page.version;
      if (m.page.id === state.current) { state.page = m.page; render(); }
      refreshThumbs();
      break;
    case 'laser':
      if (m.page === state.current) { lasers.push({ points: m.points, at: performance.now() }); render(); }
      break;
    case 'asset':
      delete images[m.id]; render(); refreshThumbs();
      break;
    default:
      return loadAll();
  }
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/live`);
  ws.onmessage = (e) => onLive(JSON.parse(e.data));
  ws.onopen = () => loadAll();
  ws.onclose = () => { $('dot').classList.remove('on'); setTimeout(connect, 1500); };
}

window.addEventListener('resize', render);
render();
connect();
</script>
</body>
</html>
