[package]
name = "synctablet"
version = "0.1.0"
edition = "2024"
description = "Apuntes a mano en la tablet Android que aparecen en vivo en tu PC con Linux"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
